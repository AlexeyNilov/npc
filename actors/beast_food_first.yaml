id: beast
capabilities:
  - move
  - consume
motivations:
  - avoid-danger
  - find-nourishment
perception_questions: []
rules:
  - label: eat
    motivation: find-nourishment
    when:
      co_located_tag: food
    proposal:
      kind: consume
      target_tag: food
  - label: flee
    motivation: avoid-danger
    when:
      all:
        - tag_exists: threat
        - distance_to_tag_at_most:
            tag: threat
            distance: 1
    proposal:
      kind: move
      relative_to: threat
      direction: away
  - label: move toward food
    motivation: find-nourishment
    when:
      all:
        - tag_exists: food
        - not:
            co_located_tag: food
    proposal:
      kind: move
      relative_to: food
      direction: toward
