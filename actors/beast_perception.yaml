id: beast
capabilities:
  - move
motivations:
  - avoid-danger
  - find-nourishment
perception_questions:
  - Is the wolf dangerous?
  - Is food available?
rules:
  - label: flee
    motivation: avoid-danger
    when:
      perception_answer:
        question: Is the wolf dangerous?
        is: true
    proposal:
      kind: move
      relative_to: threat
      direction: away
  - label: move toward food
    motivation: find-nourishment
    when:
      perception_answer:
        question: Is food available?
        is: true
    proposal:
      kind: move
      relative_to: food
      direction: toward
  - label: wait
    motivation: avoid-danger
    when:
      not:
        perception_answer:
          question: Is the wolf dangerous?
          is: true
    proposal:
      kind: wait
